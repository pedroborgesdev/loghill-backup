services:
  logmate:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      DATA_DIR: /app/data
      APP_PUBLIC_URL: http://localhost:8080
      # Defina APP_PASSWORD para exigir login na interface.
      # APP_PASSWORD: troque-me
      TZ: America/Sao_Paulo
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
